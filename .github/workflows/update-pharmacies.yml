name: Update pharmacy schedule

on:
  schedule:
    - cron: "30 5 * * *"   # every day at 05:30 UTC (the union changes the list weekly)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python3 -m unittest discover -s tools
      - name: Fetch the schedule
        run: python3 tools/scrape_marrakech.py --out data/marrakech.json --dump-dir raw
      - name: Commit if the file changed
        run: |
          if [ -n "$(git status --porcelain data/marrakech.json)" ]; then
            git config user.name "schedule-bot"
            git config user.email "schedule-bot@users.noreply.github.com"
            git add data/marrakech.json
            git commit -m "Update Marrakech pharmacy schedule"
            git push
          else
            echo "No change"
          fi
      - name: Keep raw pages when the run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: raw-pages
          path: raw
