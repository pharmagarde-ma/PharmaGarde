name: Build signed release (AAB + APK)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing secret KEYSTORE_BASE64. Add the four secrets first (see README)."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build signed AAB and APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pharmagarde-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
      - name: Publish the APK as a downloadable release (no zip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0-build${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk "pharmagarde-$TAG.apk"
          ls -l "pharmagarde-$TAG.apk"
          gh release create "$TAG" "pharmagarde-$TAG.apk" --prerelease \
            --title "PharmaGarde $TAG" \
            --notes "Signed release APK for testing on a phone. The Play Store file (AAB) is in the workflow artifacts."
